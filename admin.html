  /* ---------- actions ---------- */
  async function run(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg); } catch (e) { console.error(e); $('#deskErr').textContent = (e && e.message) || String(e); } }
  document.addEventListener('input', e => { const ta = e.target.closest('textarea[id^="note-"]'); if (ta) S.notes[ta.id.slice(5)] = ta.value; });
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    const sub = S.pending.find(x => x.id === id), pub = S.stories.find(x => x.id === id);
    if (act === 'approve' && sub) { b.disabled = true; return run(() => store.approve(id, sub), a('approved')); }
    if (act === 'reject') { S.confirm = { id, kind: 'reject' }; renderQueue(); const y = $(`[data-act="reject-yes"][data-id="${CSS.escape(id)}"]`); y && y.focus(); return; }
    if (act === 'reject-yes') { S.confirm = null; return run(() => store.reject(id), a('rejected')); }
    if (act === 'return') { S.confirm = { id, kind: 'return' }; renderQueue(); const ta = $(`#note-${CSS.escape(id)}`); ta && ta.focus(); return; }
    if (act === 'return-yes' && sub) {
      const note = ($(`#note-${CSS.escape(id)}`) || {}).value || '';
      if (note.trim().length < 3) { const er = $(`#noteErr-${CSS.escape(id)}`); if (er) er.textContent = a('needNote'); return; }
      S.confirm = null; delete S.notes[id]; b.disabled = true;
      return run(() => store.sendBack(id, sub, note.trim()), a('sentBack'));
    }
    if (act === 'photo-del') { const kind = b.dataset.kind, n = +b.dataset.n; return run(async () => { await store.deletePhoto(kind, id, n); delete S.photos[kind + '/' + id]; renderQueue(); if (viewing && viewing.id === id) openView(Object.assign({}, viewing, { photos: Math.max(0, (viewing.photos || 1) - 1) })); }, a('photoRemoved')); }
    if (act === 'cert') return makeCert(b.dataset.cid);
    if (act === 'delete') { S.confirm = { id, kind: 'delete' }; renderPub(); const y = $(`[data-act="delete-yes"][data-id="${CSS.escape(id)}"]`); y && y.focus(); return; }
    if (act === 'delete-yes') { S.confirm = null; return run(() => store.deleteStory(id), a('deleted')); }
    if (act === 'cancel') { S.confirm = null; renderQueue(); renderPub(); return; }
    if (act === 'feature' && pub) return run(() => store.updateStory(id, { featured: !pub.featured }), pub.featured ? a('featuredOff') : a('featuredOn'));
    if (act === 'hide' && pub) return run(() => store.unpublish(id), a('hidden'));
    if (act === 'edit-pending' && sub) return openEdit(sub, 'pending');
    if (act === 'edit-pub' && pub) return openEdit(Object.assign({}, pub, { teller: pub.teller || (S.priv[id] || {}).teller || '', showName: !!pub.teller }), 'pub');
    if (act === 'view' && pub) return openView(pub);
  });

  /* ---------- edit ---------- */
  let editing = null;
  function placeSelects(p, d, m) {
    $('#eProv').innerHTML = opt(-1, a('choose')) + P.map((x, i) => opt(i, MSK.nm({ en: x[0], ne: x[1] }), i === p)).join('');
    $('#eDist').innerHTML = opt(-1, a('choose')) + (p >= 0 ? P[p][2].map((x, i) => opt(i, MSK.nm({ en: x[0], ne: x[1] }), i === d)).join('') : '');
    $('#eMuni').innerHTML = opt(-1, a('choose')) + (p >= 0 && d >= 0 ? P[p][2][d][2].map((x, i) => opt(i, MSK.nm({ en: x[0], ne: x[1] }), i === m)).join('') : '');
  }
  $('#eProv').addEventListener('change', e => placeSelects(+e.target.value, -1, -1));
  $('#eDist').addEventListener('change', e => placeSelects(+$('#eProv').value, +e.target.value, -1));
  const eEditor = MSK.rich.mount($('#eEditor'), { withFont: true, labelledBy: 'eTextLbl', id: 'eText' });
  function openEdit(s, kind) {
    editing = { id: s.id, kind };
    $('#eTitle').value = s.title || '';
    if (s.html) eEditor.setHTML(s.html); else eEditor.setText(s.text || ''); eEditor.setFont(s.font || 'serif');
    $('#eGenre').innerHTML = MSK.GENRES.map(x => opt(x.id, MSK.nm(x), x.id === s.genre)).join('');
    $('#eKind').innerHTML = MSK.KINDS.map(x => opt(x.id, MSK.nm(x), x.id === s.kind)).join('');
    $('#eReuse').innerHTML = MSK.REUSE.map(x => opt(x.id, MSK.nm(x), x.id === s.reuse)).join('');
    $('#eHeard').innerHTML = MSK.HEARD.map(x => opt(x.id, MSK.nm(x), x.id === s.heard)).join('');
    $('#eEra').innerHTML = MSK.ERAS.map(x => opt(x.id, MSK.nm(x), x.id === s.era)).join('');
    $('#eLang').value = s.language || '';
    const L = s.loc || { p: -1, d: -1, m: -1 };
    placeSelects(L.p, L.d, L.m);
    $('#eMuniOther').value = L.mOther || ''; $('#eWard').value = L.ward || ''; $('#eVillage').value = L.village || '';
    $('#eTeller').value = s.teller || ''; $('#eShow').checked = !!s.showName;
    $('#eErr').textContent = '';
    $('#editDlg').showModal(); $('#eTitle').focus();
  }
  const closeEdit = () => { editing = null; $('#editDlg').close(); };
  $('#eClose').addEventListener('click', closeEdit); $('#eCancel').addEventListener('click', closeEdit);
  $('#eSave').addEventListener('click', async () => {
    if (!editing) return;
    const title = $('#eTitle').value.trim(), text = eEditor.getText().trim();
    if (title.length < 2 || text.length < 10) { $('#eErr').textContent = a('needTitle'); return; }
    const ward = parseInt($('#eWard').value, 10);
    const patch = {
      title, text, html: eEditor.getHTML(), font: eEditor.getFont(), genre: $('#eGenre').value, kind: $('#eKind').value, reuse: $('#eReuse').value, heard: $('#eHeard').value, era: $('#eEra').value, language: $('#eLang').value.trim(),
      loc: { p: +$('#eProv').value, d: +$('#eDist').value, m: +$('#eMuni').value, ward: ward > 0 ? ward : 0, village: $('#eVillage').value.trim(), mOther: $('#eMuniOther').value.trim() }
    };
    const teller = $('#eTeller').value.trim(), show = $('#eShow').checked;
    const ed = editing;
    if (ed.kind === 'pending') { patch.teller = teller; patch.showName = show; }
    else patch.teller = show ? teller : '';
    $('#eSave').disabled = true;
    await run(() => ed.kind === 'pending' ? store.updateSubmission(ed.id, patch) : store.updateStory(ed.id, patch), a('saved'));
    $('#eSave').disabled = false;
    closeEdit();
  });

  /* ---------- view + poster ---------- */
  let viewing = null, vOpts = { layout: 'sky', size: 'portrait' }, vUrl = null;
  function openView(s) {
    viewing = s;
    $('#vBanner').innerHTML = MSK.art.storySVG(s, 1600, 640);
    $('#vChips').innerHTML = `<span class="chip solid">${esc(nmOf(MSK.GENRES, s.genre))}</span><span class="chip">${esc(nmOf(MSK.KINDS, s.kind))}</span>`;
    $('#vTitle').textContent = s.title; $('#vPlace').textContent = MSK.place.line(s.loc);
    $('#vText').innerHTML = richHTML(s); $('#vText').lang = MSK.isDeva(s.text) ? 'ne' : 'en';
    $('#vText').className = 'story-text story-font-' + (['serif', 'sans', 'hand', 'display'].includes(s.font) ? s.font : 'serif');
    $('#vSrcT').textContent = a('sourcesLbl'); $('#vSrcList').innerHTML = sourcesHTML(s.sources); $('#vSources').hidden = !$('#vSrcList').innerHTML;
    $('#vPhotos').hidden = !(s.photos > 0); $('#vPhotos').innerHTML = '';
    if (s.photos > 0) store.getPhotos('stories', s.id).then(list => { if (!viewing || viewing.id !== s.id) return; $('#vPhotos').innerHTML = `<h3>${esc(a('photosLbl'))}</h3><div class="r-photo-grid">${photosHTML('stories', s.id, list, true)}</div>`; }).catch(() => {});
    $('#vCredit').textContent = `— ${MSK.t('toldBy')}: ${s.teller || MSK.t('anonymous')}`;
    vOpts = { layout: MSK.poster.defaultLayout(s), size: 'portrait' };
    const L = { sky: 'layoutSky', bleed: 'layoutBleed', frame: 'layoutFrame', arch: 'layoutArch' }, Z = { portrait: 'posterPortrait', story: 'posterStory', square: 'posterSquare' };
    $('#vLayout').innerHTML = MSK.poster.LAYOUTS.map(l => `<label><input type="radio" name="vl" value="${l}"${vOpts.layout === l ? ' checked' : ''}>${esc(MSK.t(L[l]))}</label>`).join('');
    $('#vSize').innerHTML = Object.keys(MSK.poster.SIZES).map(z => `<label><input type="radio" name="vs" value="${z}"${vOpts.size === z ? ' checked' : ''}>${esc(MSK.t(Z[z]))}</label>`).join('');
    drawV();
    $('#viewDlg').showModal();
  }
  async function drawV() {
    if (!viewing) return;
    const dl = $('#vDownload'); dl.setAttribute('aria-disabled', 'true'); dl.removeAttribute('href');
    const r = await MSK.poster.render(viewing, vOpts);
    if (vUrl) URL.revokeObjectURL(vUrl); vUrl = r.url;
    $('#vPoster').innerHTML = `<img src="${vUrl}" alt="">`;
    vBlob = r.blob; vName = r.filename;
    dl.href = vUrl; dl.download = r.filename; dl.setAttribute('aria-disabled', 'false');
  }
  $('#vLayout').addEventListener('change', e => { vOpts.layout = e.target.value; drawV(); });
  $('#vSize').addEventListener('change', e => { vOpts.size = e.target.value; drawV(); });
  let dlCap = null, vBlob = null, vName = '';
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(x => { dlCap = x; }).catch(() => {});
  $('#vDownload').addEventListener('click', e => {
    if ($('#vDownload').getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    if (dlCap && vBlob) { e.preventDefault(); dlCap.save({ filename: vName, data: vBlob }).catch(() => {}); }
  });
  $('#vClose').addEventListener('click', () => $('#viewDlg').close());
  $('#viewDlg').addEventListener('click', e => { if (e.target.id === 'viewDlg') $('#viewDlg').close(); });

  /* ---------- contributors & certificates ---------- */
  function peopleGroups() {
    const m = {};
    S.stories.forEach(s => { if (!s.cid) return; (m[s.cid] = m[s.cid] || []).push(s); });
    return Object.entries(m).map(([cid, list]) => {
      const pv = list.map(x => S.priv[x.id] || {});
      const name = (list.find(x => x.teller) || {}).teller || (pv.find(x => x.teller) || {}).teller || '';
      const contact = (pv.find(x => x.contact) || {}).contact || '';
      return { cid, list: list.sort((x, y) => MSK.toMs(y.approvedAt) - MSK.toMs(x.approvedAt)), name, contact, publicName: !!list.find(x => x.teller) };
    }).sort((x, y) => y.list.length - x.list.length);
  }
  function renderPeople() {
    if (!S.user) return;
    $('#peopleHint').textContent = a('peopleHint');
    const g = peopleGroups();
    if (!g.length) { $('#peopleList').innerHTML = `<div class="desk-empty"><p>${esc(a('noPeople'))}</p></div>`; return; }
    $('#peopleList').innerHTML = g.map(p => `<article class="person">
      <div class="person-main"><h3>${esc(p.name || '—')}${p.publicName ? '' : ` <small>(${esc(a('unnamed'))})</small>`}</h3>
        <div class="rev-meta"><b>${MSK.num(p.list.length)} ${esc(a('storiesN'))}</b><span>${esc(a('codeLbl'))}: ${esc(p.cid.slice(0, 8).toUpperCase())}</span>${p.contact ? `<span>${esc(a('contact'))}: ${esc(p.contact)}</span>` : ''}</div>
        <ul class="person-stories">${p.list.slice(0, 8).map(s => `<li>${esc(s.title)} <small>· ${esc(MSK.place.short(s.loc))}</small></li>`).join('')}${p.list.length > 8 ? '<li>…</li>' : ''}</ul></div>
      <div class="person-cert">${p.list.length >= MSK.certificate.NEED ? `<label class="field"><span>${esc(a('certFor'))}</span><input type="text" maxlength="80" id="cn-${esc(p.cid.slice(0, 16))}" value="${esc(p.name)}"></label><button class="btn small" type="button" data-act="cert" data-cid="${esc(p.cid)}"><svg><use href="#i-award"/></svg>${esc(a('certBtn'))}</button>` : `<span class="hint">${MSK.num(p.list.length)} / ${MSK.num(MSK.certificate.NEED)}</span>`}</div>
    </article>`).join('');
  }
  async function makeCert(cid) {
    const p = peopleGroups().find(x => x.cid === cid); if (!p) return;
    const nameEl = $(`#cn-${CSS.escape(cid.slice(0, 16))}`);
    await run(() => MSK.certificate.download({ name: (nameEl && nameEl.value.trim()) || p.name, count: p.list.length, cid, date: Date.now() }), a('certMade'));
  }

  /* ---------- logo & photo ---------- */
  function renderSettings() {
    const st = S.settings || {};
    $('#logoPrev').innerHTML = `<img src="${esc(st.logo || CFG.owner.logo)}" alt="">`;
    $('#photoPrev').innerHTML = (st.photo || CFG.owner.photo) ? `<img src="${esc(st.photo || CFG.owner.photo)}" alt="">` : '<span class="hint">—</span>';
    $('#logoDel').hidden = !st.logo; $('#photoDel').hidden = !st.photo;
    $('#brandLogo').innerHTML = `<img src="${esc(CFG.owner.icon || 'assets/logo-icon.webp')}" alt="" width="180" height="180">`;
  }
  function resize(file, max, type, quality) {
    return new Promise((res, rej) => {
      if (file.type === 'image/svg+xml') { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); return; }
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL(type, quality));
      };
      img.onerror = rej; img.src = url;
    });
  }
  async function upload(file, key) {
    if (!file) return;
    let data = await resize(file, key === 'logo' ? 480 : 900, key === 'logo' ? 'image/png' : 'image/jpeg', 0.86);
    if (data.length > 450000) data = await resize(file, key === 'logo' ? 320 : 640, key === 'logo' ? 'image/png' : 'image/jpeg', 0.78);
    if (data.length > 480000) return toast(a('tooBig'));
    await run(() => store.saveSettings({ [key]: data }), a('uploaded'));
  }
  $('#logoFile').addEventListener('change', e => { upload(e.target.files[0], 'logo'); e.target.value = ''; });
  $('#photoFile').addEventListener('change', e => { upload(e.target.files[0], 'photo'); e.target.value = ''; });
  $('#logoDel').addEventListener('click', () => run(() => store.saveSettings({ logo: '' }), a('saved')));
  $('#photoDel').addEventListener('click', () => run(() => store.saveSettings({ photo: '' }), a('saved')));

  /* ---------- boot ---------- */
  const night = MSK.art.build('owner-desk-login', 'folk', 600, 700, { sky: 'night', hero: 'chautari', centerHero: true });
  $('#loginArt').innerHTML = MSK.art.toSVG(night, 'preserveAspectRatio="xMidYMid slice"');
  $('#previewNote').hidden = store.mode !== 'preview';
  $('#lPreviewHint').hidden = store.mode !== 'preview';
  $('#lForgot').hidden = store.mode === 'preview';
  $('#lEmail').value = CFG.ownerEmail || '';
  renderText();
  store.init().catch(e => { console.error(e); $('#lErr').textContent = a('netErr'); });
  store.watchSettings(s => { S.settings = s || {}; renderSettings(); });
  store.onAuth(onUser);
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
})();

  }
  if (window.MSK_CONFIG.firebase && window.MSK_CONFIG.firebase.apiKey) return start();
  fetch('index.html', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (html) {
      var m = html && html.match(/\/\*FIREBASE-CONFIG-START\*\/([\s\S]*?)\/\*FIREBASE-CONFIG-END\*\//);
      if (!m) return;
      try {
        var v = new Function('return (' + m[1].trim().replace(/;\s*$/, '') + ')')();
        if (v && v.apiKey) window.MSK_CONFIG.firebase = v;
      } catch (e) { console.warn('The Firebase config in index.html could not be read:', e); }
    })
    .catch(function () {})
    .then(start);
})();
</script>
</body>
</html>
