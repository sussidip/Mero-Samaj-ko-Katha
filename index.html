<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mero Samaj ko Katha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eczar:wght@500;700&family=Fraunces:wght@600;700&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: one long page. Sticky header, scene hero, mission, map+reader, step-by-step story form with poster, FAQ dropdowns, owner card. Dhaka-topi zigzag bands separate the big parts. */
:root{
  --bg:#FBF1DA; --surface:#FFF9EA; --surface2:#F4E6C3; --fg:#2A1A12; --muted:#6B5646; --line:#E2CFA3;
  --red:#B4141E; --onred:#FFF6E6; --blue:#1C3F7A; --gold:#E39B00; --leaf:#2F6B3A; --shadow:rgba(60,30,10,.18);
  --display:'Fraunces','Eczar',Georgia,serif; --body:'Mukta','Noto Sans Devanagari',system-ui,sans-serif; --cream:#FAF4E4;
  --p1:#BCFAFA; --p2:#EBC6D3; --p3:#FFCEC4; --p4:#F9F5B7; --p5:#B6CAFD; --p6:#E3BBFB; --p7:#C2FCB1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1030; --surface:#121A44; --surface2:#1B2660; --fg:#F4EAD0; --muted:#B7B3C9; --line:#2D3A7A;
  --red:#E5484D; --onred:#fff; --blue:#7FA2F0; --gold:#F5B83D; --leaf:#7CC48A; --shadow:rgba(0,0,0,.5); --p1:#1F5F6B; --p2:#6B3A58; --p3:#7A4A3E; --p4:#6E6A2C; --p5:#34498F; --p6:#5E3C84; --p7:#2F6B3F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1030; --surface:#121A44; --surface2:#1B2660; --fg:#F4EAD0; --muted:#B7B3C9; --line:#2D3A7A;
  --red:#E5484D; --onred:#fff; --blue:#7FA2F0; --gold:#F5B83D; --leaf:#7CC48A; --shadow:rgba(0,0,0,.5); --p1:#1F5F6B; --p2:#6B3A58; --p3:#7A4A3E; --p4:#6E6A2C; --p5:#34498F; --p6:#5E3C84; --p7:#2F6B3F; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:100%}
html[lang="ne"]{--display:'Eczar','Fraunces',serif}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.65;padding-inline:0;transition:background .4s,color .4s}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,4.5vw,2.5rem)} h3{font-size:1.3rem}
p{margin:0}
a{color:var(--red)}
:root[data-theme="dark"] a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--red);color:var(--onred);padding:.6rem 1rem;z-index:100;border-radius:6px}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
section{padding-block:clamp(2.5rem,7vw,5rem)}
.kicker{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
:root[data-theme="dark"] .kicker{color:var(--gold)}
.dhaka{height:16px;background:
 linear-gradient(135deg,var(--red) 25%,transparent 25%) -8px 0/16px 16px,
 linear-gradient(225deg,var(--red) 25%,transparent 25%) -8px 0/16px 16px,
 linear-gradient(315deg,var(--gold) 25%,transparent 25%) 0 0/16px 16px,
 linear-gradient(45deg,var(--gold) 25%,transparent 25%) 0 0/16px 16px,var(--blue)}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.6rem;min-height:64px;flex-wrap:wrap;padding-block:.4rem}
.logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--fg);margin-right:auto;min-width:0}
.logo svg{flex:none}
.logo .l1{font-family:var(--display);font-size:1.45rem;line-height:1;white-space:nowrap}
.logo .l1 .ne{color:var(--red)} .logo .l1 .en{color:var(--blue)}
:root[data-theme="dark"] .logo .l1 .ne{color:var(--gold)} :root[data-theme="dark"] .logo .l1 .en{color:var(--fg)}
.logo small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.06em;line-height:1.2}
.tools{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.btn,.chip,.tbtn{font:inherit;cursor:pointer}
.tbtn{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;min-height:40px;min-width:40px;padding:0 .8rem;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.tbtn:hover{border-color:var(--gold)}
.tbtn[aria-pressed="true"]{background:var(--blue);color:var(--onred);border-color:var(--blue)}
:root[data-theme="dark"] .tbtn[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.menu{position:relative}
.menu ul{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.4rem;margin:0;list-style:none;box-shadow:0 12px 30px var(--shadow)}
.menu.open ul{display:block}
.menu a{display:block;padding:.55rem .8rem;border-radius:6px;text-decoration:none;color:var(--fg);font-weight:600}
.menu a:hover{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:10px;border:2px solid var(--red);background:var(--red);color:var(--onred);padding:.7rem 1.25rem;font-weight:700;font-size:1rem;text-decoration:none;min-height:46px}
:root[data-theme="dark"] .btn{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.ghost{background:transparent;color:var(--red)}
:root[data-theme="dark"] .btn.ghost{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* hero */
.hero{padding-block:0;position:relative;overflow:hidden}
.scene{position:relative;width:100%;aspect-ratio:2/1;max-height:460px;min-height:230px;background:var(--surface2)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .night{display:none}
:root[data-theme="dark"] .scene .day{display:none}
:root[data-theme="dark"] .scene .night{display:block}
.heroText{padding-block:2rem 2.5rem;display:grid;gap:1rem;max-width:760px}
.heroText h1{font-size:clamp(2rem,6vw,3.6rem)}
.heroText .sub{font-size:1.15rem;color:var(--muted)}
.row{display:flex;gap:.8rem;flex-wrap:wrap}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin-top:.5rem}
.stats b{font-family:var(--display);font-size:2rem;font-weight:400;display:block;line-height:1;color:var(--red)}
:root[data-theme="dark"] .stats b{color:var(--gold)}
.stats span{font-size:.85rem;color:var(--muted)}
/* day/night animations */
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(920px)}}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes bub{0%,15%{opacity:0;transform:translateY(8px) scale(.8)}30%,60%{opacity:1;transform:translateY(0) scale(1)}80%,100%{opacity:0;transform:translateY(-10px) scale(.9)}}
@keyframes flick{0%,100%{transform:scale(1,1)}33%{transform:scale(.92,1.08)}66%{transform:scale(1.06,.94)}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-230px)}}
@keyframes shoot{0%,86%{opacity:0;transform:translate(0,0)}88%{opacity:1}100%{opacity:0;transform:translate(-260px,150px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(900px)}}
@keyframes ring{0%{r:7;opacity:.9}100%{r:20;opacity:0}}
.star{animation:tw 3s ease-in-out infinite}
.cloud{animation:drift 70s linear infinite}
.tree{transform-origin:400px 300px;animation:sway 6s ease-in-out infinite}
.rays{transform-origin:640px 90px;animation:spin 60s linear infinite}
.bubble{animation:bub 7s ease-in-out infinite;opacity:0}
.flame{transform-origin:400px 332px;animation:flick .5s infinite}
.spark{animation:rise 5s linear infinite;opacity:0}
.shooter{animation:shoot 9s linear infinite;opacity:0}
.bird{animation:fly 28s linear infinite}
.calm *{animation:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}.bubble,.spark{opacity:.8}}
/* cards, mission */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:2rem}
.pillar{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:1.3rem}
.pillar h3{margin-bottom:.4rem;color:var(--red)}
:root[data-theme="dark"] .pillar h3{color:var(--gold)}
.lead{font-size:1.25rem;max-width:62ch;margin-top:1rem}
.mission{background:var(--surface2)}
/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem;margin-top:1.5rem;align-items:start}
@media(max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:.6rem;position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.nepal{fill:var(--surface2);stroke:var(--red);stroke-width:2.5;stroke-linejoin:round}
.dd{fill:var(--muted);opacity:.55;cursor:pointer}
.dd:hover,.dd:focus{opacity:1;fill:var(--blue)}
.pin{cursor:pointer}
.pin .core{fill:var(--gold);stroke:var(--red);stroke-width:2}
.pin .halo{fill:none;stroke:var(--gold);stroke-width:2;animation:ring 2.4s ease-out infinite}
.pin[aria-pressed="true"] .core{fill:var(--red);stroke:var(--gold)}
.maplabel{min-height:1.6em;font-weight:700;padding:.3rem .5rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.2rem}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:.25rem .85rem;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--red);color:var(--onred);border-color:var(--red)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.list{display:grid;gap:.8rem;max-height:560px;overflow:auto;padding:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:1rem;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;display:grid;gap:.3rem}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card h3{font-size:1.15rem}
.meta{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.05rem .55rem;border-radius:999px;background:var(--blue);color:var(--onred);margin-right:.3rem}
:root[data-theme="dark"] .tag{background:var(--gold);color:#1a1200}
.tag.sample{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tag.pend{background:var(--red);color:var(--onred)}
:root[data-theme="dark"] .tag.pend{background:var(--red);color:#fff}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,5,20,.65);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.ov[hidden]{display:none!important}
.modal{background:var(--surface);color:var(--fg);border:2px solid var(--gold);border-radius:16px;max-width:720px;width:100%;margin-block:auto;padding:1.5rem;display:grid;gap:1rem;position:relative}
.modal .body{white-space:pre-wrap;font-size:1.1rem;line-height:1.85}
/* form */
.formwrap{background:var(--surface);border:2px solid var(--line);border-radius:18px;margin-top:1.5rem;overflow:hidden}
.steps{display:flex;gap:0;justify-content:space-between;padding:1rem 1.2rem;background:var(--surface2);border-bottom:1.5px solid var(--line)}
.stp{display:grid;justify-items:center;gap:.2rem;flex:1;font-size:.8rem;font-weight:700;color:var(--muted);text-align:center}
.lamp{width:34px;height:34px;border-radius:50% 50% 45% 45%;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);font-family:var(--display)}
.stp.on .lamp{background:var(--gold);border-color:var(--red);color:#1a1200;box-shadow:0 0 16px var(--gold)}
.stp.on{color:var(--fg)}
.panel{padding:1.4rem;display:grid;gap:1.1rem}
.panel[hidden]{display:none}
label,.lbl{font-weight:700;display:block;margin-bottom:.25rem}
input[type=text],select,textarea{font:inherit;width:100%;padding:.7rem .85rem;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-height:46px}
textarea{min-height:240px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
.gopt{position:relative}
.gopt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.gopt span{display:grid;gap:.1rem;border:2px solid var(--line);border-radius:12px;padding:.7rem;background:var(--bg);font-weight:700;text-align:center;min-height:68px;align-content:center}
.gopt span small{font-weight:400;color:var(--muted)}
.gopt input:checked+span{border-color:var(--red);background:var(--surface2);box-shadow:0 0 0 3px var(--gold)}
.gopt input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:.8rem;background:var(--bg);cursor:pointer;margin:0;font-weight:400}
.opt input{margin-top:.4rem;width:20px;height:20px;accent-color:var(--red);flex:none}
.opt b{display:block}
.err{color:var(--red);font-weight:700;min-height:1.4em}
:root[data-theme="dark"] .err{color:#FF8A8E}
.nav[hidden]{display:none}
.nav{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:0 1.4rem 1.4rem}
.posterbox{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:1.5rem;align-items:start}
@media(max-width:760px){.posterbox{grid-template-columns:minmax(0,1fr)}}
canvas#poster{width:100%;height:auto;border-radius:10px;border:2px solid var(--gold);box-shadow:0 14px 34px var(--shadow);background:var(--surface2)}
.picker{max-width:640px}
/* FAQ */
details{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 1.1rem}
details+details{margin-top:.7rem}
summary{cursor:pointer;font-weight:700;padding:1rem 0;list-style:none;display:flex;justify-content:space-between;gap:1rem;font-size:1.08rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--display);color:var(--red);font-size:1.4rem;line-height:1}
:root[data-theme="dark"] summary::after{color:var(--gold)}
details[open] summary::after{content:"–"}
details p{padding-bottom:1rem;color:var(--muted)}
/* about */
.about{background:var(--surface2)}
.owner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.5rem;align-items:center;margin-top:1.5rem}
@media(max-width:600px){.owner{grid-template-columns:minmax(0,1fr)}}
.avatar{width:120px;height:120px;border-radius:50%;background:var(--blue);color:var(--onred);display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;border:4px solid var(--gold)}
.phone{font-weight:700;font-size:1.2rem;user-select:all}
footer{padding-block:2rem 3rem;text-align:center;color:var(--muted);font-size:.92rem}
footer .disp{color:var(--fg);font-size:1.2rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blue);color:var(--onred);padding:.8rem 1.2rem;border-radius:10px;z-index:90;max-width:90vw;box-shadow:0 8px 24px var(--shadow)}
:root[data-theme="dark"] .toast{background:var(--gold);color:#1a1200}
/* ---- v2 additions ---- */
.logo{background:var(--cream);border-radius:12px;padding:4px 12px;border:1px solid var(--line)}
.logo img{display:block;height:44px;width:auto;max-width:100%}
.logo .l1,.logo small,.logo svg{display:none}
.bar{min-height:62px}
.seg{display:inline-flex}
.seg .tbtn:first-child{border-radius:999px 0 0 999px;padding-inline:.7rem}
.seg .tbtn:last-child{border-radius:0 999px 999px 0;border-left:0;padding-inline:.7rem}
@keyframes ring{0%{r:20;opacity:.9}100%{r:52;opacity:0}}
.nepal{fill:none;stroke:var(--red);stroke-width:5;stroke-linejoin:round}
.prov{stroke:var(--bg);stroke-width:3;stroke-linejoin:round}
.pv1{fill:var(--p1)}.pv2{fill:var(--p2)}.pv3{fill:var(--p3)}.pv4{fill:var(--p4)}.pv5{fill:var(--p5)}.pv6{fill:var(--p6)}.pv7{fill:var(--p7)}
.dd{fill:var(--fg);opacity:.45;cursor:pointer}
.dd:hover,.dd:focus{opacity:1;fill:var(--blue)}
:root[data-theme="dark"] .dd:hover,:root[data-theme="dark"] .dd:focus{fill:var(--gold)}
.pin .core{stroke-width:5}
.pin .halo{stroke-width:5}
.pin text{font-size:26px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.82rem;color:var(--muted);padding:.4rem .5rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.gdot{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto .2rem;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.gopt span{min-height:78px}
.genres{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.banner{width:100%;height:auto;border-radius:12px;display:block;background:var(--surface2)}
.who{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:2rem;align-items:center;margin-top:1.5rem}
@media(max-width:760px){.who{grid-template-columns:minmax(0,1fr)}}
.portrait{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 18px 18px;border:4px solid var(--gold);display:block;background:var(--surface)}
.roles{display:flex;gap:.5rem;flex-wrap:wrap}
.roles span{border:1.5px solid var(--red);color:var(--red);border-radius:999px;padding:.1rem .8rem;font-weight:700;font-size:.9rem}
:root[data-theme="dark"] .roles span{border-color:var(--gold);color:var(--gold)}
.contacts{display:grid;gap:.5rem;margin-top:.6rem}
.crow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.crow b{min-width:7.5rem}
.crow .val{font-weight:700;user-select:all;overflow-wrap:anywhere}
.tabs{display:flex;gap:.4rem}
.tabs .tbtn[aria-selected="true"]{background:var(--blue);color:var(--onred);border-color:var(--blue)}
:root[data-theme="dark"] .tabs .tbtn[aria-selected="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.fine{font-size:.85rem;color:var(--muted)}
.adm{background:var(--surface2)}
.arow{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-top:.5rem}
.arow>span{min-width:0;overflow-wrap:anywhere}
.warn{background:var(--red);color:var(--onred)}
.hello{font-weight:700;font-size:.9rem}
.hero .scene{max-height:480px}
.mini{width:20px;height:20px;border-radius:50%}
.cap{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
@keyframes flit{0%,100%{opacity:.1;transform:translate(0,0)}50%{opacity:1;transform:translate(14px,-10px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
@keyframes ghost{0%,100%{opacity:0;transform:translate(0,6px)}40%,60%{opacity:.55;transform:translate(-14px,-8px)}}
@keyframes kite{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(10px,-8px) rotate(6deg)}}
@keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(900px)}}
.ff{animation:flit 4s ease-in-out infinite}
.hopper{animation:hop 1.1s ease-in-out infinite}
.wing{transform-origin:center;transform-box:fill-box;animation:flap .5s ease-in-out infinite}
.wisp{animation:ghost 9s ease-in-out infinite;opacity:0}
.kite{transform-box:fill-box;transform-origin:50% 100%;animation:kite 4s ease-in-out infinite}
.walker{animation:walk 40s linear infinite}

.mhead{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}

.console{position:fixed;inset:0;z-index:70;background:var(--bg);color:var(--fg);overflow:auto;padding-bottom:3rem}
.console[hidden]{display:none!important}
.chead{position:sticky;top:0;background:var(--blue);color:var(--onred);z-index:2}
:root[data-theme="dark"] .chead{background:var(--surface2)}
.chead .wrap{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:.8rem}
.chead h1{font-size:1.5rem}
.stat{display:grid;gap:.4rem;margin-top:1.2rem}
.srow{display:flex;gap:.6rem;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.dot{width:14px;height:14px;border-radius:50%;margin-top:.45rem;flex:none}
.dot.ok{background:var(--leaf)}.dot.no{background:var(--red)}
.ctabs{display:flex;gap:.5rem;margin-top:1.5rem;flex-wrap:wrap}
.ctabs .tbtn[aria-selected="true"]{background:var(--blue);color:var(--onred);border-color:var(--blue)}
:root[data-theme="dark"] .ctabs .tbtn[aria-selected="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.sc{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:1rem;margin-top:.8rem;display:grid;gap:.5rem}
.sc p.pv{color:var(--muted);overflow-wrap:anywhere}
.cerr{color:var(--red);font-weight:700}
:root[data-theme="dark"] .cerr{color:#FF8A8E}
</style>
