*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: calc(100% * var(--text-scale)); scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-0); line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper-hi); }
img, svg { max-width: 100%; }
a { color: var(--crimson); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; font-optical-sizing: auto; text-wrap: balance; margin: 0; }
h2 { font-size: var(--fs-3); }
h3 { font-size: var(--fs-1); }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--crimson); color: var(--on-crimson); padding: 10px 16px; border-radius: 8px; font-weight: 700; text-decoration: none; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 10px); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- buttons & inputs ---------- */
.btn {
  --b: var(--crimson); display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 46px; padding: .5em 1.2em; border-radius: 999px; border: 2px solid var(--b);
  background: var(--b); color: var(--on-crimson); font: 700 1rem/1.2 var(--font-body); cursor: pointer; text-decoration: none;
  transition: transform .15s ease, background .15s ease;
}
.btn:hover { background: var(--crimson-hi); border-color: var(--crimson-hi); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.btn.quiet { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn.small { min-height: 38px; padding: .3em .9em; font-size: .92rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: progress; }
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper-hi); color: var(--ink); cursor: pointer; font: 700 .95rem var(--font-body); }
.icon-btn:hover { border-color: var(--ink-3); }
.icon-btn svg { width: 22px; height: 22px; }
label { font-weight: 600; }
input[type=text], input[type=url], input[type=email], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: .55em .8em; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--paper-hi); color: var(--ink); font: 400 1rem/1.5 var(--font-body);
}
textarea { min-height: 220px; resize: vertical; line-height: 1.75; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: 2px solid color-mix(in srgb, var(--focus) 35%, transparent); outline-offset: 0; }
.hint { color: var(--ink-3); font-size: .92rem; font-weight: 400; }
.err { color: var(--bad); font-size: .92rem; font-weight: 600; min-height: 1.2em; }

/* ---------- Dhaka band ---------- */
.dhaka {
  height: 22px; border-block: 2px solid var(--ink);
  background:
    linear-gradient(135deg, transparent 0 25%, var(--dhaka-red) 25% 50%, transparent 50%) 0 0 / 22px 22px,
    linear-gradient(225deg, transparent 0 25%, var(--dhaka-red) 25% 50%, transparent 50%) 0 0 / 22px 22px,
    linear-gradient(45deg, transparent 0 40%, var(--dhaka-gold) 40% 60%, transparent 60%) 11px 0 / 22px 22px,
    #1b1410;
}

/* ---------- header ---------- */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--paper-hi) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; align-items: center; gap: 14px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 42px; height: 42px; flex: none; }
.brand-logo { display: inline-flex; align-items: center; flex: none; }
.brand-logo img { height: 52px; width: auto; display: block; }
.brand-logo .logo-l { display: var(--show-day); }
.brand-logo .logo-d { display: var(--show-night); }
.brand-logo.foot img { height: 66px; }
.brand-icon img { width: 42px; height: 42px; display: block; }
.brand-img { width: 46px; height: 46px; object-fit: contain; flex: none; border-radius: 8px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand-ne { font-family: var(--font-display); font-size: 1.35rem; white-space: nowrap; }
.brand-en { font-size: .68rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; white-space: nowrap; }
.nav a:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.tools { display: flex; gap: 6px; align-items: center; }
.lang-btn { width: auto; flex: none; padding: 0 14px; border-radius: 999px; font-family: var(--font-body); white-space: nowrap; }
.lang-btn .short { display: none; }
.menu-btn { display: none; }
@media (max-width: 960px) {
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; background: var(--paper-hi); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .nav.open { display: flex; }
  .menu-btn { display: inline-grid; }
  .tools { margin-left: auto; }
  .size-tools { display: none; }
}
@media (max-width: 420px) { .brand-logo img { height: 40px; } .lang-btn .long { display: none; } .lang-btn .short { display: inline; } .brand-en { font-size: .6rem; letter-spacing: .12em; } .brand-ne { font-size: 1.12rem; } .brand-mark, .brand-img { width: 36px; height: 36px; } .tools { gap: 4px; } .icon-btn { width: 40px; height: 40px; } .lang-btn { padding: 0 10px; } }

.preview-note { background: var(--marigold-soft); color: var(--ink); font-size: .9rem; text-align: center; padding: 6px 16px; }
.preview-note code { font-size: .85em; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; background: var(--s-sky1); }
.hero-scene { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 560; }
.hero-copy { position: absolute; inset: 0; display: flex; align-items: flex-start; pointer-events: none; }
.hero-copy .wrap { width: 100%; padding-block: clamp(24px, 3.6vw, 56px); }
.hero-text { max-width: min(31rem, 37vw); pointer-events: auto; display: grid; gap: 14px; }
.kicker { font-weight: 700; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.hero h1 { font-size: var(--fs-4); color: var(--ink); }
html[lang="ne"] .hero h1 { line-height: 1.34; }
.hero-sub { font-size: 1.08rem; color: var(--ink-2); max-width: 31rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.hero-cta .btn.ghost { background: color-mix(in srgb, var(--paper-hi) 70%, transparent); }
.tale-svg { font-family: var(--font-play); font-size: 19px; fill: var(--ink); paint-order: stroke; stroke: var(--s-bubble); stroke-width: 6px; stroke-linejoin: round; }
.hero-text h1, .hero-text .hero-sub, .hero-text .kicker { text-shadow: 0 0 22px var(--s-sky2), 0 0 2px var(--s-sky2); }
@media (max-width: 1199px) {
  .hero { display: flex; flex-direction: column-reverse; background: linear-gradient(var(--s-sky1), var(--s-sky2)); }
  .hero-copy { position: static; }
  .hero-copy .wrap { padding-block: 22px 28px; }
  .hero-scene { aspect-ratio: 1200 / 620; }
  .hero-text { max-width: 40rem; }
  .hero h1 { font-size: clamp(2rem, 6vw, 3rem); }
}
@media (max-width: 640px) { .hero-scene { aspect-ratio: 4 / 3; } }
/* scene parts */
.day-only { display: var(--show-day); }
.night-only { display: var(--show-night); }
.sky-a { stop-color: var(--s-sky1); } .sky-b { stop-color: var(--s-sky2); } .sky-c { stop-color: var(--s-sky3); }
.sc-far { fill: var(--s-far); } .sc-snow { fill: var(--s-snow); } .sc-mid { fill: var(--s-mid); } .sc-mid2 { fill: var(--s-mid2); } .sc-near { fill: var(--s-near); }
.sc-terr { fill: none; stroke: var(--s-leaf-hi); stroke-width: 2; opacity: .45; }
.sc-stone { fill: var(--s-stone); } .sc-stone2 { fill: var(--s-stone-2); } .sc-stone-line { fill: none; stroke: var(--s-stone-line); stroke-width: 1.5; }
.sc-trunk { fill: var(--s-trunk); } .sc-leaf { fill: var(--s-leaf); } .sc-leaf2 { fill: var(--s-leaf-2); } .sc-leafhi { fill: var(--s-leaf-hi); opacity: .32; }
.sk { fill: var(--s-skin); } .hair { fill: var(--s-hair); } .whair { fill: var(--s-white-hair); }
.shawl { fill: var(--s-shawl); } .shawl2 { fill: var(--s-shawl-2); } .skirt { fill: var(--s-skirt); }
.kid1 { fill: var(--s-kid1); } .kid2 { fill: var(--s-kid2); } .man { fill: var(--s-man); } .man2 { fill: var(--s-man-2); } .topi { fill: var(--s-topi); } .elder { fill: var(--s-elder); }
.arm { fill: none; stroke-linecap: round; stroke-width: 9; }
.flagline { fill: none; stroke: var(--s-flag-line); stroke-width: 1.4; }
.bubble { fill: var(--s-bubble); stroke: var(--s-bubble-line); stroke-width: 2.5; }
.bubble-dot { fill: var(--s-bubble); stroke: var(--s-bubble-line); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) {
  .sun-rays { transform-origin: 1125px 92px; animation: spin 60s linear infinite; }
  .cloud { animation: drift 70s linear infinite; }
  .cloud.c2 { animation-duration: 95s; animation-delay: -40s; }
  .flags rect { transform-box: fill-box; transform-origin: top center; animation: flutter 2.4s ease-in-out infinite; }
  .flags rect:nth-child(3n) { animation-delay: -.8s; } .flags rect:nth-child(3n+1) { animation-delay: -1.6s; }
  .canopy { transform-origin: 880px 330px; animation: sway 7s ease-in-out infinite; }
  .gesture { transform-box: fill-box; transform-origin: right bottom; animation: tell 3.2s ease-in-out infinite; }
  .listener-head { transform-box: fill-box; transform-origin: center bottom; animation: nod 5s ease-in-out infinite; }
  .listener-head.b { animation-delay: -2.2s; }
  .leaf-fall { animation: fall 9s linear infinite; }
  .leaf-fall.l2 { animation-delay: -3s; animation-duration: 11s; } .leaf-fall.l3 { animation-delay: -6s; animation-duration: 13s; }
  .bird { animation: fly 26s linear infinite; } .bird.b2 { animation-delay: -9s; animation-duration: 31s; }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .shoot { animation: shoot 9s ease-in infinite; }
  .fly { animation: firefly 6s ease-in-out infinite; }
  .flame { transform-box: fill-box; transform-origin: center bottom; animation: flicker .9s ease-in-out infinite alternate; }
  .fire-glow { animation: glow 1.8s ease-in-out infinite alternate; }
  .moon-glow { animation: glow 6s ease-in-out infinite alternate; }
  .vig { transition: opacity .7s ease, transform .7s ease; }
  .bubble-dot { animation: pop 3.2s ease-in-out infinite; }
  .bubble-dot.d2 { animation-delay: .3s; } .bubble-dot.d3 { animation-delay: .6s; }
}
.vig { opacity: 0; transform: translateY(6px) scale(.96); transform-box: fill-box; transform-origin: center; }
.vig.on { opacity: 1; transform: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1300px); } }
@keyframes flutter { 0%, 100% { transform: skewX(0) scaleY(1); } 50% { transform: skewX(-8deg) scaleY(.92); } }
@keyframes sway { 0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); } }
@keyframes tell { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-14deg); } 70% { transform: rotate(6deg); } }
@keyframes nod { 0%, 80%, 100% { transform: rotate(0); } 88% { transform: rotate(5deg); } }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-120px, 260px) rotate(320deg); opacity: 0; } }
@keyframes fly { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
@keyframes twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
@keyframes shoot { 0%, 86% { opacity: 0; transform: translate(0, 0); } 88% { opacity: 1; } 100% { opacity: 0; transform: translate(-260px, 130px); } }
@keyframes firefly { 0%, 100% { opacity: .1; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(14px, -10px); } }
@keyframes flicker { from { transform: scale(1, 1); } to { transform: scale(.9, 1.12); } }
@keyframes glow { from { opacity: .55; } to { opacity: .95; } }
@keyframes pop { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }

/* ---------- stats ---------- */
.stats { background: var(--paper-hi); border-bottom: 1px solid var(--line); }
.stats .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-block: 18px; }
.stat { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.stat b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; color: var(--crimson); line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-weight: 600; }
@media (max-width: 560px) { .stats .wrap { grid-template-columns: 1fr 1fr 1fr; } .stat { flex-direction: column; gap: 2px; } .stat b { font-size: 1.7rem; } .stat span { font-size: .85rem; line-height: 1.3; } }

/* ---------- sections ---------- */
.section { padding-block: clamp(44px, 7vw, 84px); }
.section-head { display: grid; gap: 8px; margin-bottom: 26px; max-width: 46rem; }
.section-head p { color: var(--ink-2); }
.eyebrow { font-family: var(--font-hand); font-style: italic; font-weight: 500; color: var(--crimson); font-size: 1.15rem; }

/* ---------- map ---------- */
.map-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .map-layout { grid-template-columns: 1fr; } }
.map-card { background: var(--map-bg); border-radius: 14px; padding: 12px; border: 1px solid var(--line); position: relative; }
.map-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 44px; }
.map-bar-end { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.view-toggle { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--paper-hi); border: 1.5px solid var(--line); }
.view-toggle button { min-width: 52px; min-height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font: 700 .95rem var(--font-body); cursor: pointer; letter-spacing: .04em; }
.view-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.map3d-host { position: relative; }
.nmap3d { position: relative; border-radius: 10px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--paper-hi) 70%, transparent), transparent 70%); }
.nmap3d canvas { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; }
.nmap3d canvas:active { cursor: grabbing; }
.map3d-tools { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.map3d-tools .icon-btn { width: 40px; height: 40px; font-size: 1.3rem; box-shadow: var(--shadow); }
.map3d-tools svg { width: 18px; height: 18px; }
.map3d-status { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--font-hand); font-size: 1.2rem; color: var(--ink-2); }
.map3d-status:empty { display: none; }
.map3d-hint { margin-top: 8px; }
.map3d-host:has(#map3d:empty) { min-height: 280px; }
.crumbs { font-weight: 700; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumbs b { color: var(--ink); }
.nmap { position: relative; }
.nmap-svg { display: block; width: 100%; height: auto; aspect-ratio: 1000.5 / 581.3; touch-action: manipulation; }
.nmap .prov { fill: none; }
.nmap .dist { stroke: var(--map-line); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; transition: opacity .3s, filter .2s; }
.nmap .dist.p0 { fill: var(--p0); } .nmap .dist.p1 { fill: var(--p1); } .nmap .dist.p2 { fill: var(--p2); } .nmap .dist.p3 { fill: var(--p3); } .nmap .dist.p4 { fill: var(--p4); } .nmap .dist.p5 { fill: var(--p5); } .nmap .dist.p6 { fill: var(--p6); }
.nmap .dist:hover { filter: brightness(1.08) saturate(1.15); }
.nmap .dist.dim { opacity: .35; }
.nmap.zoomed .dist { opacity: .28; }
.nmap.zoomed .dist.sel { opacity: 1; fill: var(--paper-hi); }
.nmap .muni { fill: var(--paper-hi); stroke: var(--ink-3); stroke-width: .8; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .2s; }
.nmap .muni:hover { fill: var(--marigold-soft); }
.nmap .muni.sel { fill: var(--marigold-soft); stroke: var(--crimson); stroke-width: 2.2; }
.nmap .muni.park { fill: color-mix(in srgb, var(--leaf) 22%, var(--paper-hi)); cursor: default; }
.nmap .outline { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; pointer-events: none; }
.nmap .lamp { cursor: pointer; outline: none; }
.nmap .lamp-glow { fill: var(--lamp-glow); }
.nmap .lamp-body { fill: var(--lamp); stroke: var(--ink); stroke-width: .9; vector-effect: non-scaling-stroke; }
.nmap .lamp.on .lamp-glow, .nmap .lamp:focus-visible .lamp-glow { fill: color-mix(in srgb, var(--crimson) 45%, transparent); }
.nmap .lamp.waiting .lamp-glow { fill: none; stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.nmap .lamp.waiting .lamp-body { fill: #aeb7c8; stroke: var(--ink-3); }
.nmap .lamp-wait-dot { fill: #aeb7c8; stroke: var(--ink); stroke-width: .8; vector-effect: non-scaling-stroke; }
.wait-note { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 10px 12px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--ink-2); font-size: .92rem; background: var(--card); }
.wait-note svg { flex: none; margin-top: 3px; fill: #aeb7c8; stroke: var(--ink-3); stroke-width: .8; }
.pick-map .map-bar { margin-bottom: 4px; }
.nmap .lamp-n { font: 700 9px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--paper-hi); stroke-width: 3px; }
.nmap-tip { position: absolute; transform: translate(-50%, -100%); background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 8px; font-size: .9rem; line-height: 1.3; pointer-events: none; display: grid; white-space: nowrap; z-index: 3; box-shadow: var(--shadow); }
.nmap-tip span { opacity: .8; font-size: .82rem; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .85rem; color: var(--ink-2); }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.place-pickers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.place-pickers label { display: grid; gap: 4px; font-size: .9rem; min-width: 0; }
@media (max-width: 640px) { .place-pickers { grid-template-columns: 1fr; } }
.map-side { display: grid; gap: 12px; align-content: start; }
.map-side h3 { font-size: 1.35rem; }
.side-list { display: grid; gap: 10px; max-height: 620px; overflow: auto; padding-right: 4px; }
.mini { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; color: var(--ink); font: inherit; }
.mini:hover { border-color: var(--ink-3); }
.mini svg { width: 84px; height: 64px; border-radius: 6px; display: block; }
.mini b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.mini small { color: var(--ink-3); }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--ink-2); display: grid; gap: 12px; justify-items: center; }

/* ---------- archive ---------- */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
@media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } .filters .grow { grid-column: 1 / -1; } }
.genre-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: thin; }
.gchip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px 4px 6px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper-hi); color: var(--ink); font: 600 .95rem var(--font-body); cursor: pointer; }
.gchip svg { width: 30px; height: 30px; border-radius: 50%; }
.gchip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.card { display: grid; grid-template-rows: auto 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; padding: 0; cursor: pointer; color: var(--ink); font: inherit; transition: transform .2s ease, box-shadow .2s ease; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.card-art { position: relative; aspect-ratio: 16 / 10; }
.card-art svg { width: 100%; height: 100%; display: block; }
.card-tag { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--paper-hi) 92%, transparent); color: var(--ink); font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.card-tag.r { left: auto; right: 10px; background: var(--marigold); color: #1b1410; }
.card-body { padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; }
.card-body h3 { font-size: 1.3rem; }
.card-place { color: var(--crimson); font-weight: 700; font-size: .9rem; }
.card-ex { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { font-family: var(--font-hand); font-style: italic; color: var(--ink-3); font-size: .95rem; }
.more-row { display: flex; justify-content: center; margin-top: 22px; }

/* ---------- share form ---------- */
.share-sec { background: linear-gradient(180deg, var(--paper-lo), var(--paper)); }
.journal { background: var(--paper-hi); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 8px 8px 0 var(--crimson); overflow: hidden; }
.journal-top { display: flex; gap: 0; border-bottom: 2px solid var(--ink); }
.step-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px 10px; font-weight: 700; color: var(--ink-3); background: transparent; border: 0; border-right: 1.5px solid var(--line); font: 700 .95rem var(--font-body); cursor: pointer; }
.step-tab:last-child { border-right: 0; }
.step-tab svg { width: 30px; height: 30px; }
.step-tab { --flame: var(--line); }
.step-tab.done, .step-tab.cur { --flame: var(--marigold); }
.step-tab.cur { color: var(--ink); background: color-mix(in srgb, var(--marigold) 14%, transparent); }
.step-tab.done { color: var(--ink-2); }
.journal-body { padding: clamp(18px, 4vw, 36px); }
.step { display: grid; gap: 18px; }
.step h3 { font-size: 1.6rem; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
.pick-map { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; background: var(--map-bg); max-width: 820px; width: 100%; justify-self: center; }
.genre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gopt { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 10px 6px 6px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--paper-hi); font-weight: 600; line-height: 1.2; }
.gopt input { position: absolute; opacity: 0; pointer-events: none; }
.gopt svg { width: 40px; height: 40px; border-radius: 8px; }
.gopt small { display: block; font-weight: 400; color: var(--ink-3); font-size: .78rem; }
.gopt:has(input:checked) { border-color: var(--crimson); background: color-mix(in srgb, var(--crimson) 10%, var(--paper-hi)); box-shadow: inset 0 0 0 1px var(--crimson); }
.gopt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; display: inline-flex; align-items: center; min-height: 42px; padding: 4px 14px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--paper-hi); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice { display: grid; gap: 10px; }
.choice label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--paper-hi); font-weight: 400; }
.choice label b { display: block; font-weight: 700; }
.choice input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--crimson); }
.choice label:has(input:checked) { border-color: var(--crimson); background: color-mix(in srgb, var(--crimson) 8%, var(--paper-hi)); }
.counter { text-align: right; color: var(--ink-3); font-size: .85rem; font-variant-numeric: tabular-nums; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.summary { background: var(--paper); border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; font-size: .95rem; }
.summary b { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.draft-note { color: var(--ink-3); font-size: .85rem; }
.thanks { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 20px 0; }
.thanks svg { width: 160px; height: 120px; }
.diyo-row .df { transform-box: fill-box; transform-origin: center bottom; }
@media (prefers-reduced-motion: no-preference) { .diyo-row .df { animation: flicker .8s ease-in-out infinite alternate; } .diyo-row .df:nth-child(2) { animation-delay: -.3s; } }

/* ---------- about ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: clamp(22px, 5vw, 56px); align-items: start; }
@media (max-width: 760px) { .about-grid { grid-template-columns: 1fr; } }
.portrait { position: relative; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--marigold); background: var(--paper-lo); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 5rem; color: var(--crimson); }
.about-text { display: grid; gap: 14px; }
.about-name { font-size: var(--fs-3); }
.about-name small { display: block; font-family: var(--font-body); font-size: 1rem; color: var(--ink-3); font-weight: 600; }
.tagline { font-weight: 700; color: var(--crimson); }
.roles { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.roles li { padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .9rem; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.roles li:nth-child(n+3) { border-color: color-mix(in srgb, var(--crimson) 45%, var(--line)); color: var(--crimson); }
.goal { font-family: var(--font-hand); font-style: italic; font-size: 1.2rem; border-left: 4px solid var(--marigold); padding-left: 14px; }
.contact-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
@media (max-width: 560px) { .contact-list { grid-template-columns: 1fr; } }
.contact { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.contact .ci { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--crimson) 12%, transparent); color: var(--crimson); }
.contact .ci svg { width: 20px; height: 20px; }
.contact small { display: block; color: var(--ink-3); font-size: .8rem; }
.contact a, .contact span.v { font-weight: 700; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; user-select: all; }
.contact a:hover { text-decoration: underline; }
.contact.web { grid-column: 1 / -1; text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--indigo) 9%, var(--card)); border-color: color-mix(in srgb, var(--indigo) 35%, var(--line)); }
.contact.web .ci { background: color-mix(in srgb, var(--indigo) 16%, transparent); color: var(--indigo); }
.contact.web .v { font-weight: 700; }
.contact.web .go { font-size: 1.3rem; color: var(--indigo); padding-right: 6px; }
.contact.web:hover .v { text-decoration: underline; }
.copy-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; color: var(--ink-2); padding: 4px 10px; cursor: pointer; font: 600 .8rem var(--font-body); }

/* ---------- footer ---------- */
.site-foot { background: var(--foot); color: #efe6d6; }
.site-foot .wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; padding-block: 34px; }
.site-foot a { color: #f2c23a; }
.site-foot .brand { color: #efe6d6; }
.site-foot .brand-en { color: #c9bda8; }
.foot-meta { display: grid; gap: 8px; justify-items: end; text-align: right; font-size: .92rem; color: #c9bda8; }
@media (max-width: 700px) { .site-foot .wrap { grid-template-columns: 1fr; } .foot-meta { justify-items: start; text-align: left; } }

/* ---------- reader ---------- */
dialog.reader { width: min(920px, 100vw); max-width: 100vw; max-height: calc(100dvh - 40px); height: auto; overflow: hidden; padding: 0; border: 0; border-radius: 16px; background: var(--paper-hi); color: var(--ink); box-shadow: 0 20px 70px rgba(0, 0, 0, .45); }
dialog.reader::backdrop { background: rgba(8, 6, 20, .66); backdrop-filter: blur(3px); }
@media (max-width: 700px) { dialog.reader { border-radius: 0; height: 100dvh; max-height: 100dvh; width: 100vw; margin: 0; } }
.reader-scroll { max-height: calc(100dvh - 40px); overflow: auto; }
dialog.reader:focus, dialog.reader:focus-visible, .reader-scroll:focus { outline: none; }
@media (max-width: 700px) { .reader-scroll { max-height: 100dvh; } }
/* Title card: the story's own scene with its title set over it, arranged differently per story */
.reader-banner { position: relative; display: grid; align-content: end; min-height: clamp(320px, 44vw, 430px); background: #0b1020; color: #fff; overflow: hidden; }
.banner-art { position: absolute; inset: 0; }
.banner-art svg { width: 100%; height: 100%; display: block; }
.banner-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(5, 8, 20, .92) 0%, rgba(5, 8, 20, .62) 34%, rgba(5, 8, 20, 0) 70%); }
.reader-banner[data-scrim="side"] .banner-art::after { background: linear-gradient(to right, rgba(5, 8, 20, .9) 0%, rgba(5, 8, 20, .55) 45%, rgba(5, 8, 20, 0) 78%), linear-gradient(to top, rgba(5, 8, 20, .55), rgba(5, 8, 20, 0) 45%); }
.reader-banner[data-scrim="side-r"] .banner-art::after { background: linear-gradient(to left, rgba(5, 8, 20, .9) 0%, rgba(5, 8, 20, .55) 45%, rgba(5, 8, 20, 0) 78%), linear-gradient(to top, rgba(5, 8, 20, .55), rgba(5, 8, 20, 0) 45%); }
.banner-card { position: relative; display: grid; gap: 10px; padding: clamp(110px, 16vw, 170px) clamp(18px, 4vw, 40px) clamp(18px, 3vw, 30px); max-width: 100%; }
.reader-banner[data-align="center"] .banner-card { justify-items: center; text-align: center; margin-inline: auto; max-width: 46rem; }
.reader-banner[data-align="center"] .chips, .reader-banner[data-align="center"] .meta-line { justify-content: center; }
.reader-banner[data-align="right"] .banner-card { justify-self: end; justify-items: end; text-align: right; max-width: 40rem; }
.reader-banner[data-align="right"] .chips, .reader-banner[data-align="right"] .meta-line { justify-content: flex-end; }
.reader-banner[data-align="left"] .banner-card { max-width: 40rem; }
.reader-banner h2 { color: #fff; text-shadow: 0 2px 18px rgba(0, 0, 0, .55); }
.reader-banner .chip { color: #fff; border-color: rgba(255, 255, 255, .55); background: rgba(5, 8, 20, .35); }
.reader-banner .chip.solid { background: var(--crimson); border-color: var(--crimson); color: var(--on-crimson); }
.reader-banner .meta-line { color: rgba(255, 255, 255, .85); }
.reader-banner .meta-line .place { color: #ffcf8f; }
@media (max-width: 700px) { .reader-banner { min-height: 360px; } .reader-banner[data-align] .banner-card { justify-items: start; text-align: left; margin-inline: 0; } .reader-banner[data-align] .chips, .reader-banner[data-align] .meta-line { justify-content: flex-start; } }
.voice-note { font-size: .92rem; color: var(--ink-2); background: color-mix(in srgb, var(--marigold) 16%, transparent); border-radius: 10px; padding: 8px 12px; }
.reader-close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); background: rgba(10, 8, 20, .62); color: #fff; border-color: rgba(255, 255, 255, .35); z-index: 2; }
.reader-body { padding: clamp(18px, 4vw, 40px); padding-left: max(clamp(18px, 4vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(18px, 4vw, 40px), env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; border: 1.5px solid var(--line); color: var(--ink-2); }
.chip.solid { background: var(--crimson); border-color: var(--crimson); color: var(--on-crimson); }
.reader h2 { font-size: clamp(1.9rem, 4.4vw, 2.8rem); }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-weight: 600; }
.meta-line .place { color: var(--crimson); }
.listen-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); }
.listen-bar select { width: auto; min-height: 40px; padding: 4px 8px; font-size: .9rem; max-width: 100%; }
.listen-bar .grow { flex: 1; }
.voice-panel { display: grid; gap: 10px; padding: 12px; border-radius: 12px; border: 1px dashed var(--line); font-size: .92rem; }
.voice-panel label { display: grid; gap: 4px; font-weight: 600; }
.story-text { font-size: 1.14rem; line-height: 1.95; max-width: 66ch; }
.story-text p + p { margin-top: 1em; }
.story-text .s { border-radius: 4px; transition: background .2s; cursor: pointer; }
.story-text .s.now { background: color-mix(in srgb, var(--marigold) 32%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marigold) 32%, transparent); }
.story-text[lang="ne"] { line-height: 2.05; }

/* ---------- animated quotes ---------- */

    { en: 'Your village’s story is part of Nepal’s story.', ne: 'तपाईंको गाउँको कथा नेपालकै कथाको एउटा अंश हो।' },
    { en: 'The tales told beside the fire deserve a place that never goes out.', ne: 'आगेनाछेउ सुनाइएका कथालाई कहिल्यै ननिभ्ने ठाउँ चाहिन्छ।' },
    { en: 'One story written today can reach a child a hundred years from now.', ne: 'आज लेखिएको एउटा कथा सय वर्षपछिको बच्चासम्म पुग्न सक्छ।' },
    { en: 'You don’t need to be a writer. You only need to remember.', ne: 'लेखक हुनु पर्दैन, सम्झनु मात्र पर्छ।' },
    { en: 'Ask your grandparents tonight. Write it down tomorrow.', ne: 'आज राति हजुरबुबा-हजुरआमालाई सोध्नुहोस्, भोलि लेखिहाल्नुहोस्।' },
    { en: 'Songs, sayings, ghosts and gods: every story counts.', ne: 'गीत, उखान, भूत र देउता: हरेक कथाको मूल्य छ।' },
    { en: 'A language lives as long as its stories are told.', ne: 'कथा सुनाइन्जेल भाषा बाँचिरहन्छ।' },
    { en: 'Light a lamp on the map for the place you come from.', ne: 'आफू जन्मेको ठाउँका लागि नक्सामा एउटा दियो बाल्नुहोस्।' },
    { en: 'What your mother told you at night is history too.', ne: 'आमाले राति सुनाउनुभएको कथा पनि इतिहास नै हो।' },

    SIZES, LAYOUTS, fontsReady, fit, wrap,
    defaultLayout(story) { return LAYOUTS[A().rngFrom(story.id + 'layout')() * LAYOUTS.length | 0]; },
    async draw(story, opts) {
      opts = opts || {};

      const slug = (story.title || 'story').replace(/[^\p{L}\p{M}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 50) || 'story';
      return `mero-samaj-ko-katha-${slug}.png`;
    },

    async render(story, opts) {
      const canvas = await MSK.poster.draw(story, opts);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

    async share(blob, name, title) {
      const file = new File([blob], name, { type: 'image/png' });
      await navigator.share({ files: [file], title: title || 'मेरो समाजको कथा', text: title || '' });
    },
    async download(story, opts) {
      const r = await MSK.poster.render(story, opts);
      const a = document.createElement('a'); a.href = r.url; a.download = r.filename;
      document.body.appendChild(a); a.click(); a.remove();
      return r.url;
    }
  };
})();

<script>
/* Rich story editor + safe HTML.

(function () {

    { k: 'ink', hex: '#0b1a2e', en: 'Ink', ne: 'कालो' },
    { k: 'red', hex: '#b3261e', en: 'Sindoor red', ne: 'सिन्दूरे रातो' },
    { k: 'orange', hex: '#c2500a', en: 'Marigold orange', ne: 'सयपत्री सुन्तला' },
    { k: 'green', hex: '#2e7d4f', en: 'Leaf green', ne: 'पात हरियो' },
    { k: 'blue', hex: '#1d5fd1', en: 'Sky blue', ne: 'आकाशे नीलो' },
    { k: 'plum', hex: '#7b2d8b', en: 'Plum', ne: 'बैजनी' }

    { k: 'green', hex: '#c9efc2', en: 'Green highlight', ne: 'हरियो' },

    { k: 'serif', en: 'Classic', ne: 'क्लासिक' },
    { k: 'sans', en: 'Clean', ne: 'सफा' },
    { k: 'hand', en: 'Handwritten', ne: 'हस्तलिखित' },
    { k: 'display', en: 'Poster', ne: 'पोस्टर' }

  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

    s = String(s || '').trim().toLowerCase();

    m = s.match(/^#([0-9a-f]{3})$/); if (m) return m[1].split('').map(c => parseInt(c + c, 16));
    m = s.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/); if (m) return [+m[1], +m[2], +m[3]];

<script>
/* AI-likeness estimate for a story, computed in the browser (nothing is sent anywhere).
   It looks for patterns that machine-written text tends to have — very even sentence lengths,
   stock phrases ("rich tapestry", "निष्कर्षमा"), a moral at the end, few personal or spoken
   details — and for signs of a real told story (family words, dialogue, local spoken particles).
   It is an estimate, not proof: short texts, translations and very polished human writing can
   be misjudged. The archive admin always makes the final decision. */
(function () {
  const MSK = (window.MSK = window.MSK || {});

  const STOCK_EN = ['delve', 'tapestry', 'testament to', 'in conclusion', 'it is important to note', 'it is worth noting', 'moreover', 'furthermore', 'additionally', 'vibrant', 'nestled', 'bustling', 'embark', 'realm', 'intricate', 'serves as a reminder', 'in the heart of', 'timeless', 'cherished', 'profound', 'resonate', 'captivating', 'enchanting', 'unwavering', 'symbolizes', 'symbolises', 'ultimately', 'navigate', 'foster', 'pivotal', 'a rich', 'rich cultural', 'cultural heritage', 'stands as', 'plays a crucial role', 'crucial role', 'in today\'s', 'ever-evolving', 'a beacon', 'whispers of', 'echoes of', 'the essence of', 'boundless', 'invaluable', 'a reminder that', 'teaches us', 'reminds us', 'lesson that', 'in essence', 'overall,', 'tale of', 'journey of', 'interplay', 'multifaceted', 'nuanced', 'landscape of', 'shrouded in', 'steeped in', 'woven', 'as an ai', 'i hope this', 'certainly!', 'here is a story', 'once upon a time in a small village nestled'];
  const STOCK_NE = ['निष्कर्षमा', 'अन्ततः', 'महत्वपूर्ण भूमिका', 'महत्त्वपूर्ण भूमिका', 'समृद्ध', 'प्रतीक हो', 'उल्लेखनीय', 'जीवन्त', 'अद्भुत', 'यो कथाले हामीलाई', 'सन्देश दिन्छ', 'हामी सबैलाई', 'अमूल्य', 'अविस्मरणीय', 'सांस्कृतिक सम्पदा', 'प्रेरणादायी', 'यसबाट हामीले', 'सिकाउँछ', 'सम्झाउँछ', 'यसैगरी', 'यसका अतिरिक्त', 'साथै,', 'सारांशमा', 'विशेष गरी', 'उदाहरणका लागि', 'अनुपम', 'मनमोहक', 'मनोरम', 'गहिरो सम्बन्ध', 'अटुट', 'शाश्वत', 'प्रकाश पार्छ', 'झल्काउँछ', 'प्रतिबिम्बित', 'अभिन्न अंग', 'धरोहर'];
  const HUMAN_EN = ['my grandmother', 'my grandfather', 'grandma', 'grandpa', 'my mother', 'my father', 'my mom', 'my dad', 'my aunt', 'my uncle', 'i remember', 'we used to', 'she said', 'he said', 'they said', 'my village', 'our village', 'i was', 'i still', 'back then', 'used to tell', 'aama', 'buwa', 'hajurama', 'hajurbuwa', 'didi', 'dai', 'bhai', 'kaka', 'kaki', 'mama', 'maiju'];
  const HUMAN_NE = ['हजुरआमा', 'हजुरबुबा', 'हजुरबा', 'आमा', 'बुबा', 'बा ', 'बाजे', 'बज्यै', 'दिदी', 'दाइ', 'भाइ', 'बहिनी', 'काका', 'काकी', 'मामा', 'माइजू', 'मेरो', 'हाम्रो', 'म ', 'मलाई', 'हामी', 'भन्नुहुन्थ्यो', 'सुनाउनुहुन्थ्यो', 'भन्थे', 'रे', ' नि', ' पो', 'हगि', 'क्यारे', 'होला', 'त्यतिबेला', 'उतिबेला', 'गाउँमा'];

  const words = s => (String(s).toLowerCase().match(/[\p{L}\p{M}\p{N}'’-]+/gu) || []);
  function sentences(s) {
    return String(s).replace(/([.!?।॥])\s+/g, '$1\n').split(/\n+/).map(x => x.replace(/\s+/g, ' ').trim()).filter(x => words(x).length > 0);
  }
  const count = (text, list) => { const t = ' ' + String(text).toLowerCase() + ' '; let n = 0; const hits = []; list.forEach(p => { const k = t.split(p).length - 1; if (k > 0) { n += k; hits.push(p.trim()); } }); return { n, hits }; };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* score one chunk of text: 0 (human-like) .. 100 (AI-like) */
  function scoreChunk(text) {

    const sd = Math.sqrt(lens.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, lens.length));

  }

  function analyze(text) {
    text = String(text || '').trim();
    const all = words(text);
    if (all.length < 60) return { tooShort: true, words: all.length, score: null, share: null, level: 'short', signals: [] };

    if (whole.stock.length) signals.push('stock');
    if (whole.moral) signals.push('moral');
    if (whole.human.length) signals.push('personal');
    if (whole.human.length === 0) signals.push('nopersonal');

  }

  const TXT = {
    en: {
      title: 'AI-likeness estimate', short: 'This text is too short to estimate. Write at least 60 words and check again.',
      low: 'Reads like a person telling their own story.', medium: 'Some parts read like machine-written text.', high: 'Many parts read like machine-written text.',
      score: 'Estimated AI-likeness', share: 'Share of the text that reads as AI-written',
      even: 'Sentences are unusually even in length.', stock: 'Uses phrases common in AI writing', moral: 'Ends with a general moral or lesson.',
      personal: 'Has personal or spoken details', nopersonal: 'Has few personal details (who told it, where, when).',
      policy: 'Stories with more than 50% AI-generated content are removed from the archive.',
      caveat: 'This is an automatic estimate made in your browser, not proof. It can be wrong, especially for short or translated texts. The admin makes the final decision.',
      tip: 'Tip: write it the way it was told to you — names, places, the words your elders used. That is what makes it yours.'
    },
    ne: {
      title: 'एआई-जस्तो हुने अनुमान', short: 'अनुमान गर्न यो पाठ धेरै छोटो छ। कम्तीमा ६० शब्द लेखेर फेरि जाँच्नुहोस्।',
      low: 'आफ्नै कथा सुनाएजस्तो देखिन्छ।', medium: 'केही भाग मेसिनले लेखेजस्तो देखिन्छ।', high: 'धेरै भाग मेसिनले लेखेजस्तो देखिन्छ।',

      personal: 'व्यक्तिगत वा बोलीचालीका विवरण छन्', nopersonal: 'व्यक्तिगत विवरण (कसले, कहाँ, कहिले सुनायो) कम छन्।',
      policy: '५०% भन्दा बढी एआईले बनाएको सामग्री भएका कथा संग्रहबाट हटाइन्छन्।',

    }
  };
  const tx = k => (TXT[MSK.lang] || TXT.en)[k] || TXT.en[k];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /* ready-made result card (HTML) */
  function card(r, compact) {
    if (!r || r.tooShort) return `<div class="ai-card short"><b>${esc(tx('title'))}</b><p>${esc(tx('short'))}</p></div>`;

    return `<div class="ai-card ${r.level}">

      ${compact ? '' : `<ul class="ai-sig">${sig}</ul>`}
      <p class="ai-note">${esc(tx('policy'))}</p>
      ${compact ? '' : `<p class="ai-note">${esc(tx('caveat'))}</p><p class="ai-note">${esc(tx('tip'))}</p>`}
    </div>`;
  }
  MSK.aicheck = { analyze, card, t: tx };
})();

<script>
/* Certificate of contribution, drawn on a canvas (PNG download).
   Given to contributors once 5 of their stories are published. */
(function () {
  const MSK = (window.MSK = window.MSK || {});
  const W = 2000, H = 1414;
  const SERIF = '"Fraunces", "Noto Serif Devanagari", Georgia, serif';
  const SANS = '"Inter", "Noto Sans Devanagari", system-ui, sans-serif';
  const INK = '#0b1a2e', CRIMSON = '#c2500a', GOLD = '#d39b0a', PAPER = '#fbf5e6';
  const NE_DIGITS = '०१२३४५६७८९';
  const neNum = n => String(n).replace(/[0-9]/g, d => NE_DIGITS[d]);
  function loadImg(src) { return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
  function fitFont(ctx, text, weight, family, max, min, maxW) {
    let s = max; ctx.font = `${weight} ${s}px ${family}`;
    while (s > min && ctx.measureText(text).width > maxW) { s -= 2; ctx.font = `${weight} ${s}px ${family}`; }
    return s;
  }
  function wrapCenter(ctx, text, cx, y, maxW, lh) {
    const words = text.split(' '); let line = '', lines = [];
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line);
    lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
    return lines.length * lh;
  }
  function lamp(ctx, x, y, s, col) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-6, 2); ctx.bezierCurveTo(-5, 7, 5, 7, 6, 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.bezierCurveTo(3, -5, 3.5, -1, 0, 1.6); ctx.bezierCurveTo(-3.5, -1, -3, -5, 0, -9); ctx.fill();
    ctx.restore();
  }
  /* opts: { name, count, cid, date (ms), titles: [] } */
  async function draw(opts) {
    if (MSK.poster && MSK.poster.fontsReady) await MSK.poster.fontsReady();
    try { await Promise.all([document.fonts.load(`700 90px "Fraunces"`), document.fonts.load(`italic 400 40px "Fraunces"`), document.fonts.load(`700 60px "Noto Serif Devanagari"`)]); } catch (e) {}
    const cfg = (window.MSK_CONFIG && MSK_CONFIG.owner) || {};
    const logo = await loadImg(cfg.logo);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    // paper
    const g = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1300); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f3e7cc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // dhaka border band
    const band = 34;
    if (MSK.art && MSK.art.dhakaItems) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(band, band, W - 2 * band, H - 2 * band); ctx.clip('evenodd');
      MSK.art.toCanvas(ctx, { items: MSK.art.dhakaItems(0, 0, W, band) });
      MSK.art.toCanvas(ctx, { items: MSK.art.dhakaItems(0, H - band, W, band) });
      ctx.save(); ctx.translate(band, 0); ctx.rotate(Math.PI / 2); MSK.art.toCanvas(ctx, { items: MSK.art.dhakaItems(0, 0, H, band) }); ctx.restore();
      ctx.save(); ctx.translate(W, 0); ctx.rotate(Math.PI / 2); MSK.art.toCanvas(ctx, { items: MSK.art.dhakaItems(0, 0, H, band) }); ctx.restore();
      ctx.restore();
    } else { ctx.fillStyle = CRIMSON; ctx.fillRect(0, 0, W, band); ctx.fillRect(0, H - band, W, band); ctx.fillRect(0, 0, band, H); ctx.fillRect(W - band, 0, band, H); }
    // inner rules
    ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.strokeRect(band + 26, band + 26, W - 2 * band - 52, H - 2 * band - 52);
    ctx.strokeStyle = 'rgba(11,26,46,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(band + 40, band + 40, W - 2 * band - 80, H - 2 * band - 80);
    // logo
    let y = 120;
    if (logo) { const lh = 150, lw = lh * logo.naturalWidth / logo.naturalHeight; ctx.drawImage(logo, (W - lw) / 2, y, lw, lh); y += lh + 50; } else y += 60;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = CRIMSON; ctx.font = `700 70px ${SERIF}`; ctx.fillText('प्रमाणपत्र', W / 2, y + 40); y += 82;
    ctx.fillStyle = INK; ctx.font = `600 30px ${SANS}`;
    const cap = 'CERTIFICATE OF CONTRIBUTION'; ctx.save(); ctx.letterSpacing = '8px'; ctx.fillText(cap, W / 2, y + 12); ctx.restore(); y += 70;
    ctx.fillStyle = '#4a5666'; ctx.font = `400 30px ${SANS}`;
    ctx.fillText('यो प्रमाणपत्र सम्मानपूर्वक प्रदान गरिन्छ  ·  This certificate is proudly presented to', W / 2, y); y += 120;
    // name
    const name = String(opts.name || '').trim() || '—';
    fitFont(ctx, name, 700, SERIF, 110, 54, W - 520);
    ctx.fillStyle = INK; ctx.fillText(name, W / 2, y);
    ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2 - 520, y + 34); ctx.lineTo(W / 2 + 520, y + 34); ctx.stroke();
    lamp(ctx, W / 2, y + 34, 2.2, GOLD);
    y += 110;
    const n = Math.max(0, opts.count | 0);
    ctx.fillStyle = INK; ctx.font = `500 36px ${SERIF}`;
    y += wrapCenter(ctx, `मेरो समाजको कथामा ${neNum(n)} वटा कथा योगदान गरी नेपालका कथा, मूल्य र मान्यता आउने पुस्ताका लागि जोगाउन सहयोग गर्नुभएकोमा।`, W / 2, y, W - 560, 56);
    y += 12;
    ctx.fillStyle = '#33404f'; ctx.font = `italic 400 34px ${SERIF}`;
    y += wrapCenter(ctx, `for contributing ${n} stories to Mero Samaj Ko Katha and helping preserve the stories, norms and values of Nepal for the next generation.`, W / 2, y, W - 560, 50);
    // footer: date · seal · signature
    const fy = H - 250;
    const dateMs = opts.date || Date.now();
    let dEn = '', dNe = '';
    try { dEn = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(dateMs)); } catch (e) { dEn = new Date(dateMs).toDateString(); }
    try { dNe = new Intl.DateTimeFormat('ne-NP', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(dateMs)); } catch (e) { dNe = ''; }
    if (/[A-Za-z]/.test(dNe)) dNe = ''; // this browser has no Nepali month names
    ctx.textAlign = 'center';
    const colL = 470, colR = W - 470;
    ctx.fillStyle = INK; ctx.font = `600 32px ${SANS}`; ctx.fillText(dEn, colL, fy);
    ctx.fillStyle = '#4a5666'; ctx.font = `400 26px ${SANS}`; if (dNe) ctx.fillText(dNe, colL, fy + 40);
    ctx.strokeStyle = 'rgba(11,26,46,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(colL - 200, fy + 64); ctx.lineTo(colL + 200, fy + 64); ctx.stroke();
    ctx.fillStyle = '#4a5666'; ctx.font = `500 24px ${SANS}`; ctx.fillText('मिति · Date of issue', colL, fy + 100);
    // seal
    const sx = W / 2, sy = fy + 20;
    const sg = ctx.createRadialGradient(sx, sy - 20, 10, sx, sy, 110); sg.addColorStop(0, '#f6d26a'); sg.addColorStop(1, '#c98a06');
    ctx.fillStyle = sg; ctx.beginPath();
    for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2, r = i % 2 ? 100 : 110; ctx.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,248,225,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, 82, 0, Math.PI * 2); ctx.stroke();
    lamp(ctx, sx, sy + 8, 5.2, '#fff8e6');
    ctx.fillStyle = '#5a3a00'; ctx.font = `700 22px ${SANS}`; ctx.fillText(`${n}+`, sx, sy + 66);
    // signature
    ctx.fillStyle = INK; ctx.font = `italic 400 46px ${SERIF}`; ctx.fillText(cfg.nameEn || 'Sudip Chaudhary', colR, fy + 10);
    ctx.strokeStyle = 'rgba(11,26,46,.5)'; ctx.beginPath(); ctx.moveTo(colR - 230, fy + 64); ctx.lineTo(colR + 230, fy + 64); ctx.stroke();
    ctx.fillStyle = '#4a5666'; ctx.font = `500 24px ${SANS}`; ctx.fillText('संस्थापक · Founder, Mero Samaj Ko Katha', colR, fy + 100);
    // number
    const no = 'MSK-C-' + String(opts.cid || '').slice(0, 8).toUpperCase() + '-' + n;
    ctx.fillStyle = '#6b7582'; ctx.font = `500 22px ${SANS}`; ctx.fillText(`Certificate no. ${no}  ·  @${cfg.instagramArchive || 'my.society.gallery'}`, W / 2, H - 92);
    return { canvas: cv, number: no };
  }
  async function download(opts) {
    const r = await draw(opts);
    const blob = await new Promise(res => r.canvas.toBlob(res, 'image/png'));
    const url = URL.createObjectURL(blob);
    const slug = String(opts.name || 'contributor').replace(/[^\p{L}\p{M}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 40) || 'contributor';
    const a = document.createElement('a'); a.href = url; a.download = `mero-samaj-ko-katha-certificate-${slug}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return r;
  }
  /* contributor code helpers (shared by the site and the Owner Desk) */
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    const b = new Uint8Array(12); crypto.getRandomValues(b);
    const s = Array.from(b, x => ALPH[x % ALPH.length]).join('');
    return `MSK-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
  }
  function normCode(c) { const s = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^MSK/, ''); return s.length === 12 ? `MSK-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}` : ''; }
  async function cidOf(code) {
    const c = normCode(code); if (!c) return '';
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('msk-contributor:' + c));
    return Array.from(new Uint8Array(buf), x => x.toString(16).padStart(2, '0')).join('');
  }
  MSK.certificate = { draw, download, newCode, normCode, cidOf, NEED: 5 };
})();

<script>
(function () {
  /* The Firebase config is pasted once, in index.html. The Owner Desk reads it from there. */
  function start() {
/* Data layer. Live mode = Firebase (Firestore + Auth). Preview mode = this browser's localStorage.
   Collections:
     submissions/{id}  stories waiting for approval — only the owner can read them
     stories/{id}      published stories — everyone can read
     private/{id}      teller's name + contact for published stories — owner only
     pins/{id}         place only (province, district, palika) of a story waiting for approval,
                       so a dim "waiting" lamp shows on the map; removed when the owner decides
     settings/site     logo and owner photo — everyone reads, owner writes
     submissions/{id}/photos/{n}, stories/{id}/photos/{n}
                       photos attached to a story (compressed JPEG data), private until published
     returns/{id}      a story sent back for rewriting, with the admin's note; readable only by
                       someone who knows its id (the writer's own device) */
(function () {
  const MSK = (window.MSK = window.MSK || {});
  const CFG = window.MSK_CONFIG || {};
  const FB_VER = '10.12.2';
  const PUBLIC_FIELDS = ['title', 'text', 'html', 'font', 'sources', 'photos', 'cid', 'genre', 'kind', 'heard', 'era', 'language', 'loc', 'teller', 'reuse', 'featured', 'sample', 'createdAt', 'approvedAt'];
  /* the fields the first version of the Firebase rules accepts (used if the rules have not been updated yet) */
  const LEGACY_FIELDS = ['title', 'text', 'genre', 'kind', 'heard', 'era', 'language', 'loc', 'teller', 'showName', 'contact', 'reuse', 'consent', 'lang'];
  const denied = e => /permission|insufficient/i.test(String((e && (e.code || e.message)) || ''));
  const RETURN_FIELDS = ['title', 'text', 'html', 'font', 'sources', 'genre', 'kind', 'heard', 'era', 'language', 'loc', 'reuse'];
  const photoDoc = (ph, i) => ({ n: i, data: String(ph.data || ''), caption: String(ph.caption || '').slice(0, 160), credit: String(ph.credit || '').slice(0, 80) });

  function pick(obj, keys) { const o = {}; keys.forEach(k => { if (obj[k] !== undefined) o[k] = obj[k]; }); return o; }
  function toMs(v) { if (!v) return 0; if (typeof v === 'number') return v; if (v.toMillis) return v.toMillis(); if (v.seconds) return v.seconds * 1000; return Date.parse(v) || 0; }
  function publicFrom(sub) {
    const s = pick(sub, PUBLIC_FIELDS);
    s.teller = sub.showName ? (sub.teller || '') : '';
    return s;
  }
  MSK.toMs = toMs;
  const pinOf = loc => ({ p: (loc && loc.p) | 0, d: (loc && loc.d) | 0, m: loc && loc.m >= 0 ? loc.m | 0 : -1 });

  /* Owner Desk password check for preview mode: compares a SHA-256 fingerprint, so the password itself is not stored in the site files. */
  async function checkPreviewPassword(pass) {
    if (CFG.previewPasswordHash) {
      try {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pass || '')));
        const hex = Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
        return hex === CFG.previewPasswordHash.toLowerCase();
      } catch (e) { return false; }
    }
    return !!CFG.previewPassword && pass === CFG.previewPassword;
  }

  /* ---------------- Preview (localStorage) ---------------- */
  function Preview() {
    const KEY = 'msk-preview-db-v1';
    const listeners = new Set();
    let mem = null;
    function load() {
      if (mem) return mem;
      try { mem = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { mem = null; }
      if (!mem) {
        mem = { submissions: {}, stories: {}, private: {}, pins: {}, settings: {}, photos: { submissions: {}, stories: {} }, returns: {} };
        if (CFG.previewSamples !== false && MSK.SAMPLES) MSK.SAMPLES.forEach(s => { mem.stories[s.id] = Object.assign({}, s); });
        save();
      }
      if (!mem.pins) mem.pins = {};
      if (!mem.photos) mem.photos = { submissions: {}, stories: {} };
      if (!mem.returns) mem.returns = {};
      return mem;
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* storage full or blocked: keep in memory */ } emit(); }
    function emit() { listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
    window.addEventListener('storage', e => { if (e.key === KEY) { mem = null; emit(); } });
    let authed = false; try { authed = sessionStorage.getItem('msk-preview-auth') === '1'; } catch (e) {}
    const authCbs = new Set();
    const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const sorted = (coll, field) => Object.entries(load()[coll]).map(([k, v]) => Object.assign({ id: k }, v)).sort((a, b) => toMs(b[field]) - toMs(a[field]));
    function watch(fn) { const run = () => fn(); listeners.add(run); setTimeout(run, 0); return () => listeners.delete(run); }
    return {
      mode: 'preview',
      async init() { load(); },
      async submit(data, photos) {
        const k = id(), db = load();
        db.submissions[k] = Object.assign({}, data, { photos: (photos || []).length, status: 'pending', createdAt: Date.now() });
        db.pins[k] = Object.assign(pinOf(data.loc), { createdAt: Date.now() });
        if (photos && photos.length) db.photos.submissions[k] = photos.map(photoDoc);
        save(); return k;
      },
      async getPhotos(kind, idv) { return (load().photos[kind] || {})[idv] || []; },
      async deletePhoto(kind, idv, n) { const db = load(); const list = (db.photos[kind] || {})[idv]; if (!list) return; db.photos[kind][idv] = list.filter(x => x.n !== n); const coll = kind === 'stories' ? db.stories : db.submissions; if (coll[idv]) coll[idv].photos = db.photos[kind][idv].length; save(); },
      async getReturn(idv) { return load().returns[idv] || null; },
      async checkRules() { return true; },
      watchStories(cb) { return watch(() => cb(sorted('stories', 'approvedAt'))); },
      watchPins(cb) { return watch(() => cb(sorted('pins', 'createdAt'))); },
      watchSettings(cb) { return watch(() => cb(load().settings.site || {})); },
      /* owner */
      onAuth(cb) { authCbs.add(cb); setTimeout(() => cb(authed ? { email: CFG.ownerEmail, preview: true } : null), 0); return () => authCbs.delete(cb); },
      async signIn(email, pass) {
        if (!(await checkPreviewPassword(pass))) { const e = new Error('wrong-password'); e.code = 'auth/wrong-password'; throw e; }
        authed = true; try { sessionStorage.setItem('msk-preview-auth', '1'); } catch (e) {}
        authCbs.forEach(cb => cb({ email: email || CFG.ownerEmail, preview: true }));
      },
      async signOut() { authed = false; try { sessionStorage.removeItem('msk-preview-auth'); } catch (e) {} authCbs.forEach(cb => cb(null)); },
      watchPending(cb) { return watch(() => cb(sorted('submissions', 'createdAt'))); },
      watchPrivate(cb) { return watch(() => cb(load().private)); },
      async approve(idv, sub) {
        const db = load();
        db.stories[idv] = Object.assign(publicFrom(sub), { approvedAt: Date.now() });
        db.private[idv] = { teller: sub.teller || '', contact: sub.contact || '', showName: !!sub.showName };
        const ph = db.photos.submissions[idv]; if (ph) { db.photos.stories[idv] = ph; db.stories[idv].photos = ph.length; delete db.photos.submissions[idv]; }
        delete db.submissions[idv]; delete db.pins[idv]; save();
      },
      async reject(idv) { const db = load(); delete db.submissions[idv]; delete db.pins[idv]; delete db.photos.submissions[idv]; save(); },
      async sendBack(idv, sub, note) {
        const db = load();
        db.returns[idv] = Object.assign(pick(sub, RETURN_FIELDS), { note: String(note || '').slice(0, 1000), at: Date.now() });
        delete db.submissions[idv]; delete db.pins[idv]; delete db.photos.submissions[idv]; save();
      },
      async updateStory(idv, patch) { const db = load(); if (!db.stories[idv]) return; Object.assign(db.stories[idv], patch); save(); },
      async updateSubmission(idv, patch) { const db = load(); if (!db.submissions[idv]) return; Object.assign(db.submissions[idv], patch); if (patch.loc) db.pins[idv] = Object.assign(pinOf(patch.loc), { createdAt: (db.pins[idv] || {}).createdAt || Date.now() }); save(); },
      async deleteStory(idv) { const db = load(); delete db.stories[idv]; delete db.private[idv]; delete db.pins[idv]; delete db.photos.stories[idv]; save(); },
      async saveSettings(patch) { const db = load(); db.settings.site = Object.assign({}, db.settings.site || {}, patch); save(); }
    };
  }

  /* ---------------- Live (Firebase) ---------------- */
  function Live(fbConfig) {
    let F = {}, A = {}, app, db, auth;
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const ready = (async () => {
      const [appMod, fsMod, authMod] = await Promise.all([
        import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')
      ]);
      F = fsMod; A = authMod;
      app = appMod.initializeApp(fbConfig);
      db = F.getFirestore(app);
      auth = A.getAuth(app);
    })();

      mode: 'live',

          const b = F.writeBatch(db);
          b.set(ref, Object.assign({}, doc, { status: 'pending', createdAt: F.serverTimestamp() }));
          b.set(F.doc(db, 'pins', ref.id), Object.assign(pinOf(doc.loc), { createdAt: F.serverTimestamp() }));

  const a = k => (A[MSK.lang] && A[MSK.lang][k]) || A.en[k] || k;

  const fmt = ms => { if (!ms) return '—'; try { return new Intl.DateTimeFormat(MSK.lang === 'ne' ? 'ne-NP' : 'en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)); } catch (e) { return new Date(ms).toLocaleString(); } };

  function onUser(u) {
    S.user = u;
    S.unsubs.forEach(f => f()); S.unsubs = [];
    $('#login').hidden = !!u; $('#desk').hidden = !u; $('#signOut').hidden = !u; $('#who').hidden = !u;
    if (!u) { $('#lEmail').value = $('#lEmail').value || CFG.ownerEmail || ''; S.pending = []; S.stories = []; return; }
    $('#who').textContent = u.email || '';
    $('#deskErr').textContent = '';
    const denied = e => { if (e && /permission/i.test(e.code || e.message || '')) $('#deskErr').textContent = a('notOwner'); };
    S.unsubs.push(store.watchPending(list => { S.rawPending = list; syncPending(); }, denied));
    S.unsubs.push(store.watchStories(list => { S.stories = list; syncPending(); renderPub(); if (S.tab === 'people') renderPeople(); }, denied));
    S.unsubs.push(store.watchPrivate(m => { S.priv = m || {}; renderPub(); if (S.tab === 'people') renderPeople(); }));
    S.firstLoad = true;
    setTab(S.tab);

  }
  /* A story that is already published is never shown as waiting again, and the desk opens on Published when nothing is waiting. */
  function syncPending() {
    const pub = new Set(S.stories.map(x => x.id));
    S.pending = (S.rawPending || []).filter(x => !pub.has(x.id));

  /* ---------- tabs ---------- */

  /* ---------- waiting queue ---------- */
  function fact(label, value, cls) { return `<div class="fact${cls ? ' ' + cls : ''}"><small>${esc(label)}</small>${value}</div>`; }
  function confirmBox(id, kind) {

          ${Array.isArray(s.sources) && s.sources.length ? `<div class="rev-sec r-sources"><b>${esc(a('sourcesLbl'))}</b><ul>${sourcesHTML(s.sources)}</ul></div>` : ''}

  /* ---------- published ---------- */
  ['input', 'change'].forEach(ev => { $('#pubQ').addEventListener(ev, renderPub); $('#pubGenre').addEventListener(ev, renderPub); $('#pubSort').addEventListener(ev, renderPub); });
  function renderPub() {
